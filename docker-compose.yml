# docker-compose.yml — Optional: run Qdrant server for production mode
# Usage: docker compose up -d
# Then set qdrant.mode: server in your config YAML.

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-os-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data_server:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
