# configs/groq.yaml — Groq API Configuration (Fast + Cloud Ready)

parsing:
  primary: docling
  fallback_enabled: true
  fallback: pymupdf

chunking:
  max_chunk_size: 512
  min_chunk_size: 100
  overlap: 50
  context_header: true

embeddings:
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  batch_size: 32
  device: cpu  # Must be CPU for Streamlit Cloud (No MPS/CUDA)
  query_prefix: "Represent this sentence for searching relevant passages: "

qdrant:
  mode: local
  path: ./qdrant_data
  collection_name: rag_os_chunks

reranker:
  enabled: true
  model_name: BAAI/bge-reranker-base
  device: cpu

retrieval:
  top_k: 10
  top_p: 0.9

generation:
  enabled: true
  provider: groq
  model: llama-3.1-8b-instant  # Lightning fast
  temperature: 0.1
  max_tokens: 512
  system_prompt: |
    You are a helpful technical assistant. Answer the question CONCISELY (max 3-4 sentences).
    Use ONLY the provided context.
    Cite sources using ONLY the bracketed number, e.g. [1], [2]. Do NOT write the full filename.
    If the context does not contain enough information, say so.

data:
  pdf_dir: ./data/pdfs
  eval_file: ./data/eval/questions.jsonl
  output_dir: ./outputs
