# configs/cpu.yaml — CPU-only configuration (Apple Silicon / MacBook Air)

parsing:
  primary: docling            # Primary parser
  fallback_enabled: true      # Enable PyMuPDF fallback if Docling fails
  fallback: pymupdf

chunking:
  max_chunk_size: 512         # Max tokens per chunk (approximate by chars)
  min_chunk_size: 100         # Minimum chunk size to keep
  overlap: 50                 # Overlap between chunks (chars)
  context_header: true        # Prepend context headers to chunk text

embeddings:
  model_name: BAAI/bge-small-en-v1.5
  dimension: 384
  batch_size: 32
  device: mps
  query_prefix: "Represent this sentence for searching relevant passages: "

qdrant:
  mode: local                 # "local" = embedded, "server" = HTTP client
  path: ./qdrant_data         # Used when mode=local
  url: http://localhost:6333  # Used when mode=server
  collection_name: rag_os_chunks

reranker:
  enabled: false              # Toggle off for speed on CPU
  model_name: BAAI/bge-reranker-base
  top_k: 5                    # Re-rank top N hits
  device: cpu

retrieval:
  top_k: 10                   # Number of candidates from vector search

generation:
  enabled: true
  provider: ollama
  model: qwen2.5:3b           # Ollama model tag
  base_url: http://localhost:11434
  temperature: 0.1
  max_tokens: 512
  system_prompt: |
    You are a helpful technical assistant. Answer the question CONCISELY (max 3-4 sentences)
    using ONLY the provided context. Cite sources using [Source: filename, Page: N].
    If the context does not contain enough information, say so.

data:
  pdf_dir: ./data/pdfs
  eval_file: ./data/eval/questions.jsonl
  output_dir: ./outputs
